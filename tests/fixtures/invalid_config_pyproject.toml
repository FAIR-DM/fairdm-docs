# Invalid configuration values for testing validation

[project]
name = "test-project"
version = "1.0.0"
description = "Test project with invalid config"
requires-python = ">=3.11"

[tool.fairdm.docs]
source_dir = "docs"
build_dir = "docs/_build/html"
port = 99999  # Invalid: exceeds max port number
