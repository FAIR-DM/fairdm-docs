[project]
name = "fairdm-docs"
description = "Standardized documentation configuration and tooling for FairDM-powered research data portals"
license = "MIT"
dynamic = ["version", "classifiers"]
readme = "README.md"
authors = [{ name = "Sam", email = "samuel.scott.jennings@gmail.com" }]
requires-python = '>=3.10'
dependencies = [
    'sphinx (>=8.1)',
    'markdown',
    'myst-parser (>=4.0)',
    'sphinx-autobuild (>=2024.10)',
    'sphinx-autodoc2 (>=0.5)',
    'sphinx-comments (>=0.0.3)',
    'sphinx-copybutton (>=0.5)',
    'sphinx-design (>=0.6)',
    'sphinx-exec-code (>=0.16,<0.17)',
    'sphinxext-opengraph (>=0.9)',
    'sphinxcontrib-bibtex (>=2.6.3,<3.0.0)',
]

[project.urls]
homepage = "https://github.com/FAIR-DM/fairdm-docs"
repository = "https://github.com/FAIR-DM/fairdm-docs"
documentation = "https://github.com/FAIR-DM/fairdm-docs#readme"

[project.optional-dependencies]
sphinx-book-theme = ['sphinx-book-theme (>1.1)']
pydata-sphinx-theme = ['pydata-sphinx-theme (>=0.16.1)']

[tool.poetry]
version = "0.1.0"
packages = [{ include = "fairdm_docs" }]
include = ["LICENSE", "README.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django :: 5.0",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development :: Documentation",
]
requires-poetry = '>=2.0,<3.0'

[tool.poetry.group.dev.dependencies]
black = "^23.1.0"
invoke = "^2.0.0"
pre-commit = "^3.2.2"

[build-system]
requires = ['poetry-core (>=2.0,<3.0)']
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py38']
preview = true

[tool.isort]
profile = "black"
